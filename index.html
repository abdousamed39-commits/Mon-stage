<!DOCTYPE html>
<html lang="fr">

<!-- Le document HTML commence ici et la langue est en français -->

<head>
    <!-- Encodage des caractères pour afficher les accents correctement -->
    <meta charset="UTF-8">
    <!-- Titre de la page qui s'affiche dans l'onglet du navigateur -->
    <title>FITS - Gestion Boutique</title>
</head>

<body>
    <!-- La section <style> contient les règles CSS de mise en page -->
    <style>
        /* Centre les titres de la page */
        h1 {
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        h3 {
            text-align: center;
        }

        table {
            width: 80%;
            border-collapse: collapse;
        }

        /* Style des cellules du tableau */
        th,
        td {
            padding: 10px;
            text-align: left;
            border: 1px solid black;
        }

        /* En-tête du tableau avec fond bleu clair */
        th {
            background-color: lightblue;
        }

        /* Style des champs de saisie */
        input {
            padding: 8px;
        }

        /* Style du bouton de formulaire */
        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        .delete-button {
            background-color: red;
        }

        /* Met en évidence les produits sans stock et les produits en stock faible. */
        .stock-empty {
            color: red;
            font-weight: bold;
        }

        .stock-low {
            color: orange;
            font-weight: bold;
        }
    </style>

    <!-- Titre principal de la page -->
    <h1>Bienvenue chez FITS</h1>

    <!-- Sous-titre de la boutique -->
    <h2>Gestion de la boutique</h2>

    <!-- Titre du stock disponible -->
    <h3>stock de la boutique FITS</h3>

    <!-- La recherche filtre les lignes du tableau à partir du nom du produit. -->
    <label for="product-search">Rechercher un produit par nom :</label>
    <input id="product-search" type="search" placeholder="Ex : Routeur">

    <!-- Le tableau affiche la liste des produits en stock -->
    <table border="1">
        <!-- Une ligne de titre pour les colonnes du tableau -->
        <tr>
            <th>Produit</th>
            <th>Prix(MRU)</th>
            <th>Quantité</th>
            <th>Réference</th>
            <th>Action</th>
        </tr>

        <!-- <th> sert à créer une cellule d'en-tête (colonne) -->
        <!-- <td> sert à créer une cellule de contenu (ligne) -->

        <!-- Première ligne du tableau : un produit avec son prix et sa quantité -->
        <tbody id="product-rows">
            <tr>
                <td>Caméra de surveillance</td>
                <td>1500</td>
                <td>10</td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>Routeur Wi-Fi</td>
                <td>800</td>
                <td>5</td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>Cable réseau</td>
                <td>100</td>
                <td>20</td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>Suiwitch réseau</td>
                <td>1200</td>
                <td>4</td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>Clé USB</td>
                <td>200</td>
                <td>15</td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>Ordinateur portable</td>
                <td>9000</td>
                <td>50</td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>Disque dur</td>
                <td>2500</td>
                <td>30</td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <!-- Titre du formulaire d'ajout de produit -->
    <h3>Ajouter un nouveau produit</h3>

    <!-- <form> permet de créer un formulaire pour recueillir des informations -->
    <form id="product-form">
        <!-- <label> affiche le nom du champ -->
        <label for="product-name">Nom du produit :</label>
        <!-- <input> permet de saisir du texte -->
        <input id="product-name" type="text" placeholder="Ex : Caméra IP" required>
        <br><br>

        <label for="product-price">Prix (MRU) :</label>
        <input id="product-price" type="number" min="0" placeholder="Ex : 1500" required>
        <br><br>

        <label for="product-quantity">Quantité :</label>
        <input id="product-quantity" type="number" min="0" step="1" placeholder="Ex : 10" required>
        <br><br>

        <label for="product-reference">Référence :</label>
        <input id="product-reference" type="text" placeholder="Ex : CAM-001" required>
        <br><br>

        <!-- Bouton qui permet d'ajouter un produit sans envoyer les données -->
        <button type="submit">Ajouter le produit</button>
    </form>

    <script>
        // Récupère les éléments utilisés par les fonctions de gestion du stock.
        const productForm = document.getElementById("product-form");
        const productRows = document.getElementById("product-rows");
        const productSearch = document.getElementById("product-search");
        // Une quantité de 1 à 5 inclus est considérée comme un stock faible.
        const lowStockThreshold = 5;

        // Ignore les majuscules et les accents pour rendre la recherche plus souple.
        function normalizeText(text) {
            return text.toLocaleLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        // Affiche uniquement les produits dont le nom contient le texte recherché.
        function filterProducts() {
            const searchTerm = normalizeText(productSearch.value.trim());

            productRows.querySelectorAll("tr").forEach((row) => {
                row.hidden = !normalizeText(row.cells[0].textContent).includes(searchTerm);
            });
        }

        // Remplace la quantité d'une cellule par des commandes +/- et sa valeur.
        function addQuantityControls(cell, initialQuantity) {
            const quantity = Number(initialQuantity);
            if (!Number.isInteger(quantity) || quantity < 0) {
                throw new Error("La quantité doit être un entier positif ou nul.");
            }

            cell.textContent = "";
            const decreaseButton = document.createElement("button");
            decreaseButton.type = "button";
            decreaseButton.textContent = "-";
            decreaseButton.setAttribute("aria-label", "Diminuer la quantité");

            const quantityValue = document.createElement("span");
            quantityValue.textContent = String(quantity);
            quantityValue.style.margin = "0 8px";

            // Met à jour la couleur selon la quantité actuelle.
            const updateStockStatus = (currentQuantity) => {
                quantityValue.classList.toggle("stock-empty", currentQuantity === 0);
                quantityValue.classList.toggle("stock-low", currentQuantity > 0 && currentQuantity <= lowStockThreshold);
            };

            const increaseButton = document.createElement("button");
            increaseButton.type = "button";
            increaseButton.textContent = "+";
            increaseButton.setAttribute("aria-label", "Augmenter la quantité");

            // Modifie la quantité sans autoriser de valeur négative.
            const updateQuantity = (change) => {
                const currentQuantity = Number(quantityValue.textContent);
                const nextQuantity = currentQuantity + change;
                if (nextQuantity < 0) {
                    return;
                }

                quantityValue.textContent = String(nextQuantity);
                decreaseButton.disabled = nextQuantity === 0;
                updateStockStatus(nextQuantity);
            };

            decreaseButton.addEventListener("click", () => updateQuantity(-1));
            increaseButton.addEventListener("click", () => updateQuantity(1));
            decreaseButton.disabled = quantity === 0;
            updateStockStatus(quantity);
            cell.append(decreaseButton, quantityValue, increaseButton);
        }

        // Ajoute un bouton de suppression qui demande une confirmation avant d'agir.
        function addDeleteButton(row) {
            const actionCell = row.cells[4];
            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.textContent = "Supprimer";
            deleteButton.classList.add("delete-button");
            deleteButton.addEventListener("click", () => {
                const productName = row.cells[0].textContent;
                if (window.confirm(`Voulez-vous vraiment supprimer « ${productName} » ?`)) {
                    row.remove();
                }
            });
            actionCell.appendChild(deleteButton);
        }

        // Initialise les commandes de quantité et de suppression des produits existants.
        productRows.querySelectorAll("tr").forEach((row) => {
            addQuantityControls(row.cells[2], row.cells[2].textContent.trim());
            addDeleteButton(row);
        });
        // Actualise les résultats à chaque saisie dans le champ de recherche.
        productSearch.addEventListener("input", filterProducts);

        // Ajoute une nouvelle ligne au tableau lors de l'envoi du formulaire.
        productForm.addEventListener("submit", (event) => {
            // Empêche le rechargement de la page par défaut lors de l'envoi.
            event.preventDefault();

            // Lit et nettoie les valeurs saisies dans le formulaire.
            const name = document.getElementById("product-name").value.trim();
            const price = document.getElementById("product-price").value;
            const quantity = document.getElementById("product-quantity").value;
            const reference = document.getElementById("product-reference").value.trim();
            const row = document.createElement("tr");

            // Crée les cellules du nom et du prix.
            [name, price].forEach((value) => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            // Ajoute la quantité avec les mêmes commandes et couleurs que les autres produits.
            const quantityCell = document.createElement("td");
            addQuantityControls(quantityCell, quantity);
            row.appendChild(quantityCell);

            // Ajoute la référence et l'action de suppression.
            const referenceCell = document.createElement("td");
            referenceCell.textContent = reference;
            row.appendChild(referenceCell);

            const actionCell = document.createElement("td");
            row.appendChild(actionCell);
            addDeleteButton(row);
            productRows.appendChild(row);
            // Réapplique la recherche, vide le formulaire puis replace le curseur sur le nom.
            filterProducts();
            productForm.reset();
            document.getElementById("product-name").focus();
        });
    </script>

</body>

  </html>
