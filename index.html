<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>FITS - Gestion Boutique</title>
    <style>
        h1, h2, h3 { text-align: center; }
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 90%; margin: auto; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border: 1px solid black; }
        th { background-color: lightblue; }
        input { padding: 8px; }
        button { background-color: blue; color: white; padding: 8px 12px; border: none; cursor: pointer; border-radius: 4px; }
        .delete-button { background-color: red; }
        .stock-empty { color: red; font-weight: bold; }
        .stock-low { color: orange; font-weight: bold; }
        form { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Bienvenue chez FITS</h1>
    <h2>Gestion de la boutique</h2>
    <h3>Stock de la boutique FITS</h3>

    <div style="text-align:center; margin-bottom: 15px;">
        <label for="product-search">Rechercher un produit par nom :</label>
        <input id="product-search" type="search" placeholder="Ex : Routeur">
    </div>

    <table border="1">
        <thead>
            <tr>
                <th>Produit</th>
                <th>Prix(MRU)</th>
                <th>Quantité</th>
                <th>Référence</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="product-rows"></tbody>
    </table>

    <h3>Ajouter un nouveau produit</h3>
    <form id="product-form">
        <label>Nom du produit :</label>
        <input id="product-name" type="text" placeholder="Ex : Caméra IP" required><br><br>
        <label>Prix (MRU) :</label>
        <input id="product-price" type="number" min="0" placeholder="Ex : 1500" required><br><br>
        <label>Quantité :</label>
        <input id="product-quantity" type="number" min="0" step="1" placeholder="Ex : 10" required><br><br>
        <label>Référence :</label>
        <input id="product-reference" type="text" placeholder="Ex : CAM-001" required><br><br>
        <button type="submit">Ajouter le produit</button>
    </form>

<script>
const productForm = document.getElementById("product-form");
const productRows = document.getElementById("product-rows");
const productSearch = document.getElementById("product-search");
const lowStockThreshold = 5;

const defaultProducts = [
    { name: "Caméra de surveillance", price: 1500, qty: 10, ref: "CAM-001" },
    { name: "Routeur Wi-Fi", price: 800, qty: 5, ref: "ROUT-002" },
    { name: "Cable réseau", price: 100, qty: 20, ref: "CABL-003" },
    { name: "Switch réseau", price: 1200, qty: 4, ref: "SWIT-004" },
    { name: "Clé USB", price: 200, qty: 15, ref: "USB-005" },
    { name: "Ordinateur portable", price: 9000, qty: 50, ref: "PC-006" },
    { name: "Disque dur", price: 2500, qty: 30, ref: "HDD-007" }
];

function normalizeText(text) {
    return text.toLocaleLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function filterProducts() {
    const term = normalizeText(productSearch.value.trim());
    productRows.querySelectorAll("tr").forEach(row => {
        row.hidden = !normalizeText(row.cells[0].textContent).includes(term);
    });
}

function saveToStorage() {
    const products = [];
    productRows.querySelectorAll("tr").forEach(row => {
        products.push({
            name: row.cells[0].textContent,
            price: row.cells[1].textContent,
            qty: row.cells[2].querySelector("span")?.textContent || row.cells[2].textContent,
            ref: row.cells[3].textContent
        });
    });
    localStorage.setItem("fits_stock_v2", JSON.stringify(products));
}

function addQuantityControls(cell, initialQuantity) {
    cell.textContent = "";
    const dec = document.createElement("button"); dec.textContent = "-"; dec.type="button";
    const span = document.createElement("span"); span.textContent = String(initialQuantity); span.style.margin="0 8px";
    const inc = document.createElement("button"); inc.textContent = "+"; inc.type="button";

    const updateStatus = (q) => {
        span.classList.toggle("stock-empty", q === 0);
        span.classList.toggle("stock-low", q > 0 && q <= lowStockThreshold);
    };
    const update = (change) => {
        const next = Number(span.textContent) + change;
        if(next < 0) return;
        span.textContent = String(next);
        dec.disabled = next === 0;
        updateStatus(next);
        saveToStorage();
    };
    dec.addEventListener("click", () => update(-1));
    inc.addEventListener("click", () => update(1));
    dec.disabled = Number(initialQuantity) === 0;
    updateStatus(Number(initialQuantity));
    cell.append(dec, span, inc);
}

function addDeleteButton(row) {
    const actionCell = row.cells[4]; actionCell.textContent="";
    const btn = document.createElement("button"); btn.textContent="Supprimer"; btn.className="delete-button"; btn.type="button";
    btn.addEventListener("click", () => {
        if(confirm(`Voulez-vous vraiment supprimer « ${row.cells[0].textContent} » ?`)){
            row.remove(); saveToStorage();
        }
    });
    actionCell.appendChild(btn);
}

function createRow(p) {
    const row = document.createElement("tr");
    const c1 = document.createElement("td"); c1.textContent = p.name;
    const c2 = document.createElement("td"); c2.textContent = p.price;
    const c3 = document.createElement("td");
    const c4 = document.createElement("td"); c4.textContent = p.ref;
    const c5 = document.createElement("td");
    row.append(c1,c2,c3,c4,c5);
    addQuantityControls(c3, p.qty);
    addDeleteButton(row);
    productRows.appendChild(row);
}

function loadProducts() {
    const saved = localStorage.getItem("fits_stock_v2");
    const list = saved ? JSON.parse(saved) : defaultProducts;
    productRows.innerHTML = "";
    list.forEach(createRow);
}

productSearch.addEventListener("input", filterProducts);
productForm.addEventListener("submit", (e) => {
    e.preventDefault();
    createRow({
        name: document.getElementById("product-name").value.trim(),
        price: document.getElementById("product-price").value,
        qty: document.getElementById("product-quantity").value,
        ref: document.getElementById("product-reference").value.trim()
    });
    saveToStorage();
    filterProducts();
    productForm.reset();
});

loadProducts();
</script>
</body>
</html>
